name: Twice-Daily YouTube Shorts (v3.0)

on:
  schedule:
    # ── Run 1:  6:00 AM IST = 00:30 UTC  (morning scroll) ──
    - cron: "30 0 * * *"
    # ── Run 2:  7:00 PM IST = 13:30 UTC  (evening prime time) ──
    - cron: "30 13 * * *"
  workflow_dispatch:
    # Manual trigger from GitHub → Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Step 1: Checkout code ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Install system dependencies ─────────────────────────────────
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg

      # ── Step 3: Set up Python ────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── Step 4: Install Python dependencies ──────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Step 5: Restore topic history (prevents duplicate shorts) ────────────
      # topic_history.json remembers the last 200 topics used
      - name: Restore topic history cache
        uses: actions/cache@v4
        with:
          path: topic_history.json
          key: topic-history-${{ github.run_id }}
          restore-keys: |
            topic-history-

      # ── Step 6: Restore topic bank (v3.0 — persistent angle/cooldown state) ──
      - name: Restore topic bank cache
        uses: actions/cache@v4
        with:
          path: topic_bank.json
          key: topic-bank-${{ github.run_id }}
          restore-keys: |
            topic-bank-

      # ── Step 7: Restore trend cache (6-hour TTL, saves RSS calls) ────────────
      - name: Restore trend cache
        uses: actions/cache@v4
        with:
          path: trend_cache.json
          key: trend-cache-${{ github.run_id }}
          restore-keys: |
            trend-cache-

      # ── Step 8: Restore performance log (self-learning memory) ───────────────
      - name: Restore performance log
        uses: actions/cache@v4
        with:
          path: performance_log.json
          key: perf-log-${{ github.run_id }}
          restore-keys: |
            perf-log-

      # ── Step 9: Create .env from GitHub Secrets ──────────────────────────────
      - name: Write environment variables
        run: |
          echo "GEMINI_API_KEY_1=${{ secrets.GEMINI_API_KEY_1 }}" >> .env
          echo "GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}" >> .env
          echo "GEMINI_API_KEY_3=${{ secrets.GEMINI_API_KEY_3 }}" >> .env
          echo "GEMINI_API_KEY_4=${{ secrets.GEMINI_API_KEY_4 }}" >> .env
          echo "GEMINI_API_KEY_5=${{ secrets.GEMINI_API_KEY_5 }}" >> .env
          echo "GEMINI_API_KEY_6=${{ secrets.GEMINI_API_KEY_6 }}" >> .env
          echo "GEMINI_API_KEY_7=${{ secrets.GEMINI_API_KEY_7 }}" >> .env
          echo "GEMINI_API_KEY_8=${{ secrets.GEMINI_API_KEY_8 }}" >> .env
          echo "GEMINI_API_KEY_9=${{ secrets.GEMINI_API_KEY_9 }}" >> .env
          echo "GEMINI_API_KEY_10=${{ secrets.GEMINI_API_KEY_10 }}" >> .env
          echo "GEMINI_API_KEY_11=${{ secrets.GEMINI_API_KEY_11 }}" >> .env
          echo "GEMINI_API_KEY_12=${{ secrets.GEMINI_API_KEY_12 }}" >> .env
          echo "GEMINI_API_KEY_13=${{ secrets.GEMINI_API_KEY_13 }}" >> .env
          echo "GEMINI_API_KEY_14=${{ secrets.GEMINI_API_KEY_14 }}" >> .env
          echo "GEMINI_API_KEY_15=${{ secrets.GEMINI_API_KEY_15 }}" >> .env
          echo "GEMINI_API_KEY_16=${{ secrets.GEMINI_API_KEY_16 }}" >> .env
          echo "GEMINI_API_KEY_17=${{ secrets.GEMINI_API_KEY_17 }}" >> .env
          echo "GEMINI_API_KEY_18=${{ secrets.GEMINI_API_KEY_18 }}" >> .env
          echo "GEMINI_API_KEY_19=${{ secrets.GEMINI_API_KEY_19 }}" >> .env
          echo "GEMINI_API_KEY_20=${{ secrets.GEMINI_API_KEY_20 }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}" >> .env

      # ── Step 10: Restore YouTube credentials from Secrets ────────────────────
      - name: Restore YouTube credentials
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_B64 }}" | base64 --decode > token.pickle
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}" | base64 --decode > client_secret.json

      # ── Step 11: Generate and upload one YouTube Short ───────────────────────
      - name: Generate and upload YouTube Short
        run: python main.py

      # ── Step 12: Archive final video as artifact (debugging / backup) ────────
      - name: Archive generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-short-${{ github.run_id }}
          path: assets/final/*.mp4
          retention-days: 7
          if-no-files-found: warn
